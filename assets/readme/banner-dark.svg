<text x="46" y="118" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-size="54" font-weight="800" fill="url(#gTitle)" letter-spacing="-1.5" text-anchor="start" >sonic-tradelytics</text>
<text x="48" y="154" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-size="18" font-weight="500" fill="#E9F2F1" text-anchor="start" >매 거래마다 <tspan fill="#FF8A1F" font-weight="700">근거 · 예측 · 결과</tspan>가 남는, 검증 가능한 단타 봇</text>
<polygon points="590,150 612,138 634,144 656,120 678,128 700,104 722,112 744,86 766,94 788,70 800,74 800,170 590,170" fill="url(#gArea)" opacity="0.8"/>
