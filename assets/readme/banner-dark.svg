<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E13"/><stop offset="1" stop-color="#101820"/></linearGradient>
<linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0" stop-color="#2EE6A6"/><stop offset="0.5" stop-color="#5EEAD4"/><stop offset="1" stop-color="#2EE6A6"/>
  <animate attributeName="x1" values="-100%;0%;-100%" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2EE6A6" stop-opacity="0.35"/><stop offset="1" stop-color="#2EE6A6" stop-opacity="0"/></linearGradient>
<linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2EE6A6" stop-opacity="0"/><stop offset="0.5" stop-color="#2EE6A6"/><stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2EE6A6" stroke-opacity="0.07"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
<clipPath id="frame"><rect width="840" height="230" rx="20"/></clipPath>
</defs><g clip-path="url(#frame)"><rect width="840" height="230" fill="url(#bg)"/><rect width="840" height="230" fill="url(#grid)"/></g>
<g clip-path="url(#frame)">
